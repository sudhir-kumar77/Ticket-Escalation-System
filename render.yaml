---
# Render Infrastructure-as-Code
# https://render.com/docs/infrastructure-as-code
#
# Services:
#   nvara-db      → Managed PostgreSQL 16
#   nvara-api     → Fastify API (port 4000)
#   nvara-web     → React SPA served via Nginx (proxies /v1/ to API)
#
# BEFORE deploying: set EMAIL_USER and EMAIL_PASS in the Render dashboard
# (Dashboard → nvara-api → Environment) with your Mailtrap SMTP credentials.
#
# Worker is omitted — enable separately when upgrading to a paid tier.

databases:
  - name: nvara-db
    databaseName: nvara_production
    user: nvara
    plan: free
    ipAllowList: []   # allow all (internal Render network only)

services:
  # ── API ─────────────────────────────────────────────────────────────────────
  - type: web
    name: nvara-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nvara-db
          property: connectionString
      - key: DEFAULT_ORGANIZATION_NAME
        value: Nvara Media
      - key: PUBLIC_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: API_PORT
        value: "4000"
      - key: LOG_LEVEL
        value: info
      - key: SLA_POLL_INTERVAL_SECONDS
        value: "60"
      - key: WEB_ORIGIN
        fromService:
          name: nvara-web
          type: web
          property: host
      # ── SMTP (optional) ───────────────────────────────────────────────────
      # Add EMAIL_HOST, EMAIL_USER, EMAIL_PASS, EMAIL_FROM via Render dashboard
      # when you're ready to enable email features (password reset, invitations).


  # ── Web (SPA + Nginx proxy) ──────────────────────────────────────────────────
  - type: web
    name: nvara-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    envVars:
      - key: API_URL
        fromService:
          name: nvara-api
          type: web
          property: host
