---
# Render Infrastructure-as-Code
# https://render.com/docs/infrastructure-as-code
#
# Services:
#   nvara-db      → Managed PostgreSQL 16
#   nvara-api     → Fastify API (port 4000)
#   nvara-web     → React SPA served via Nginx (proxies /v1/ to API)
#
# BEFORE deploying: set EMAIL_USER and EMAIL_PASS in the Render dashboard
# (Dashboard → nvara-api → Environment) with your Mailtrap SMTP credentials.
#
# Worker is omitted — enable separately when upgrading to a paid tier.

databases:
  - name: nvara-db
    databaseName: nvara_production
    user: nvara
    plan: free
    ipAllowList: []   # allow all (internal Render network only)

services:
  # ── API ─────────────────────────────────────────────────────────────────────
  - type: web
    name: nvara-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nvara-db
          property: connectionString
      - key: DEFAULT_ORGANIZATION_NAME
        value: Nvara Media
      - key: PUBLIC_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: API_PORT
        value: "4000"
      - key: LOG_LEVEL
        value: info
      - key: SLA_POLL_INTERVAL_SECONDS
        value: "60"
      - key: WEB_ORIGIN
        fromService:
          name: nvara-web
          type: web
          property: host
      # ── SMTP (Mailtrap) ────────────────────────────────────────────────────
      # ACTION REQUIRED: Set EMAIL_USER and EMAIL_PASS in the Render dashboard
      # before deploying. Go to: Dashboard → nvara-api → Environment
      # Get credentials from: https://mailtrap.io → Inboxes → SMTP Settings
      - key: EMAIL_HOST
        value: sandbox.smtp.mailtrap.io
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Nvara Operations <noreply@nvaramedia.com>"

  # ── Web (SPA + Nginx proxy) ──────────────────────────────────────────────────
  - type: web
    name: nvara-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    envVars:
      - key: API_URL
        fromService:
          name: nvara-api
          type: web
          property: host
